name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ruff==0.8.6

      - run: ruff check .

      - run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: pytest --cov=app --cov-report=term-missing

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dias-sin-incidentes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: verificar usuario no-root
        run: test "$(docker run --rm dias-sin-incidentes:ci whoami)" = "appuser"

      - name: smoke test de /health
        run: |
          docker run -d --name api -p 8000:8000 dias-sin-incidentes:ci
          for i in $(seq 1 15); do
            curl -fs localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1